# F-Droid build metadata prepared for submission to fdroiddata.
#
# Stable tag: pending; v0.1.0 predates the vanilla flavor rename.
# Commit: main is temporary; replace it with the vanilla release tag or hash.
# Signing: F-Droid-hosted; do not add Binaries or AllowedAPKSigningKeys.
#
# The vanilla flavor appends "-vanilla" to the version name, so versionName
# below is 0.1.0-vanilla.

Categories:
  - Internet
  - System
AuthorName: FossScout contributors
License: MIT
SourceCode: https://github.com/FossScout/FossScout
IssueTracker: https://github.com/FossScout/FossScout/issues
Liberapay: FossScout
RepoType: git
Repo: https://github.com/FossScout/FossScout.git

Builds:
  - versionName: '0.1.0-vanilla'
    versionCode: 1
    commit: main
    submodules: true
    gradle:
      - vanilla
    output: app/build/outputs/apk/vanilla/release/app-vanilla-release-unsigned.apk

RequiresRoot: false
UpdateCheckMode: Static
CurrentVersion: '0.1.0-vanilla'
CurrentVersionCode: 1
MaintainerNotes: |
  The vanilla build declares QUERY_ALL_PACKAGES solely to enumerate installed
  apps for the local full scan. The scan stays on-device. The app has no install,
  uninstall, or accessibility permissions. The Play flavor does not declare
  QUERY_ALL_PACKAGES.
