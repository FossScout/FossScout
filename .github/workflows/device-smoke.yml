name: Device Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK and emulator
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y wget unzip
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          unzip -q /tmp/cmdline-tools.zip -d /tmp
          mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0" \
            "emulator" \
            "system-images;android-36;default;x86_64"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APKs
        run: ./gradlew assemblePlaystoreDebug assembleVanillaDebug

      - name: Boot emulator and run smoke test
        run: |
          set -euo pipefail
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          rm -rf "$ANDROID_AVD_HOME"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force \
            --name smoke \
            --package "system-images;android-36;default;x86_64" \
            --device "pixel_6"
          ls -la "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/emulator/emulator" -list-avds
          "$ANDROID_HOME/emulator/emulator" -avd smoke \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            kill "$EMULATOR_PID" 2>/dev/null || true
            adb emu kill >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          timeout 600 adb wait-for-device
          timeout 600 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 5; done'
          adb shell input keyevent 224 || true
          adb shell wm dismiss-keyguard || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 0
          adb shell wm user-rotation lock 0
          adb shell cmd uimode night no
          adb shell cmd connectivity airplane-mode disable || true
          mkdir -p "$RUNNER_TEMP/device-smoke"
          adb devices -l > "$RUNNER_TEMP/device-smoke/adb-devices.txt"
          python3 .github/scripts/device_smoke.py \
            --output "$RUNNER_TEMP/device-smoke" \
            --play-apk app/build/outputs/apk/playstore/debug/app-playstore-debug.apk \
            --vanilla-apk app/build/outputs/apk/vanilla/debug/app-vanilla-debug.apk \
            --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2"

      - name: Publish smoke report
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/device-smoke"
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/device-smoke/emulator.log" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/device-smoke/report.md" ]; then
            cat "$RUNNER_TEMP/device-smoke/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Smoke test did not produce a report." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: device-smoke
          path: ${{ runner.temp }}/device-smoke
          retention-days: 14
