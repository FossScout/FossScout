# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# AGP 9 built-in Kotlin bundles Kotlin 2.2; keep the Kotlin plugin until the
# built-in version supports the project's Kotlin 2.4 toolchain. The Kotlin
# Android plugin is incompatible with the AGP 9 new DSL, so both opt-outs are
# required until that migration.
android.builtInKotlin=false
android.newDsl=false
